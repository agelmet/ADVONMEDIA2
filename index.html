      /* --- STRICT MOBILE RESPONSIVENESS FIXES --- */
      html, body {

      /* --- SPA Router Classes --- */
      .page-section { display: none; opacity: 0; animation: fadeIn 0.5s forwards; }

      /* --- Background Animations --- */
      #star-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
      
      .laser-beam-main {
        position: fixed; left: 50%; top: 0; transform: translateX(-50%);
        width: 80px; height: 100vh;
        background: linear-gradient(180deg, rgba(71, 200, 245, 0.1) 0%, rgba(71, 200, 245, 0.4) 10%, rgba(71, 200, 245, 0.9) 30%, rgba(71, 200, 245, 1) 50%, rgba(71, 200, 245, 0.9) 70%, rgba(71, 200, 245, 0.4) 90%, rgba(71, 200, 245, 0.1) 100%);

        animation: laser-pour 1.5s ease-in-out infinite; border-radius: 10px; z-index: 1; pointer-events: none;
      }
      .laser-beam-main::before {
        content: ''; position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 200px; height: 100%;
        background: linear-gradient(180deg, transparent 0%, rgba(71, 200, 245, 0.05) 20%, rgba(71, 200, 245, 0.15) 50%, rgba(71, 200, 245, 0.05) 80%, transparent 100%); filter: blur(20px);
      }
      .laser-splash {
        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 300px; height: 150px;
        background: radial-gradient(ellipse at center bottom, rgba(71, 200, 245, 0.6) 0%, rgba(71, 200, 245, 0.3) 30%, rgba(71, 200, 245, 0.1) 60%, transparent 100%);
        filter: blur(30px); animation: splash-pulse 1.5s ease-in-out infinite; z-index: 2; pointer-events: none;
      }
      .laser-splash::before {
        content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 80px;
        background: radial-gradient(ellipse at center bottom, rgba(71, 200, 245, 0.8) 0%, rgba(71, 200, 245, 0.4) 40%, transparent 100%);
        filter: blur(15px); animation: splash-inner 1s ease-in-out infinite;
      }
      @keyframes laser-pour { 0%, 100% { opacity: 0.8; transform: translateX(-50%) scaleY(1); } 25% { opacity: 1; transform: translateX(-50%) scaleY(1.02); } 50% { opacity: 0.9; transform: translateX(-50%) scaleY(0.98); } 75% { opacity: 1; transform: translateX(-50%) scaleY(1.01); } }

      /* --- UI Elements --- */
      .glass-panel { 
        background: rgba(8, 18, 25, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
        border: 1px solid rgba(71, 200, 245, 0.15); box-shadow: inset 0 0 20px rgba(71,200,245,0.05), 0 8px 32px rgba(0, 0, 0, 0.5);

      .text-shimmer { background: linear-gradient(to right, #47c8f5 20%, #ffffff 50%, #47c8f5 80%); background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text; animation: shimmer 4s linear infinite; }

                            </a>
                        </div>
                    </div>
                    <div class="lg:col-span-7 h-[600px] overflow-hidden mask-vertical relative">
                        <div class="flex flex-col gap-6 animate-vertical-scroll py-4" id="reviews-list"></div>
                    </div>
                </div>
            `;
            renderReviews();

            // Portfolio Home Header
            document.getElementById('portfolio-header').innerHTML = `
                <span class="text-electric-cyan text-xs font-bold tracking-[0.3em] uppercase mb-4 block">${elUpper(t.sectionTitles.portfolio)}</span>
                <h2 class="text-4xl md:text-5xl font-black font-display mb-4">${t.sectionTitles.portfolioMain}</h2>
            `;
            updatePortfolioPagination();

            // Inner Pages
            document.getElementById('website-content').innerHTML = pageContentData[currentLang].webHtml;
            document.getElementById('nfc-content').innerHTML = pageContentData[currentLang].nfcHtml;
            document.getElementById('social-content').innerHTML = pageContentData[currentLang].socialHtml;
            document.getElementById('faq-header').innerHTML = `<h2 class="text-4xl md:text-5xl font-black font-display mb-4 text-white drop-shadow-lg">${t.sectionTitles.faq}</h2>`;
            document.getElementById('faq-inner-container').innerHTML = faqsData[currentLang].map(f => `
                <div class="glass-panel rounded-2xl overflow-hidden group border border-white/5 hover:border-electric-cyan/40 transition-colors">
                    <button onclick="toggleFaq(this)" class="w-full flex items-center justify-between p-6 text-left font-bold text-lg text-white hover:text-electric-cyan transition-colors">
                        ${f.q}
                        <div class="p-2 rounded-full bg-white/5 group-hover:bg-electric-cyan/10 transition-colors">
                            <i data-lucide="chevron-down" class="w-5 h-5 transition-transform duration-400"></i>
                        </div>
                    </button>
                    <div class="max-h-0 overflow-hidden transition-all duration-500 ease-in-out px-6 text-gray-400 leading-relaxed text-md font-medium">
                        <div class="pb-8 pt-2">${f.a}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('blog-overview').innerHTML = pageContentData[currentLang].blogOverviewHtml;
            document.getElementById('blog-grid').innerHTML = blogListData[currentLang].map(b => `
                <div class="glass-panel p-8 rounded-3xl cursor-pointer hover:-translate-y-2 transition-all flex flex-col h-full hover:border-electric-cyan/50" onclick="openBlog(${b.id})">
                    <div class="text-sm text-electric-cyan font-bold mb-4">${b.date}</div>
                    <h2 class="text-2xl font-bold font-display text-white mb-4 line-clamp-3">${b.title}</h2>
                    <p class="text-gray-400 line-clamp-3 flex-grow">${b.snippet}</p>
                    <span class="mt-6 flex items-center gap-2 text-electric-cyan font-bold text-sm uppercase tracking-wide">${b.cta} <i data-lucide="arrow-right" class="w-4 h-4"></i></span>
                </div>
            `).join('');

            document.getElementById('privacy-content').innerHTML = pageContentData[currentLang].privacyHtml;
            document.getElementById('cookies-content').innerHTML = pageContentData[currentLang].cookiesHtml;
            document.getElementById('terms-content').innerHTML = pageContentData[currentLang].termsHtml;

            // Contact
            document.getElementById('contact-container').innerHTML = `
                <span class="text-electric-cyan text-xs font-black tracking-[0.4em] uppercase mb-4 block drop-shadow-[0_0_15px_rgba(71,200,245,0.6)]">${elUpper(t.sectionTitles.contact)}</span>
                <h2 class="text-4xl md:text-6xl font-black font-display mb-16 text-white">${t.sectionTitles.contactMain}</h2>
                <div class="grid md:grid-cols-2 gap-8 mb-16 items-stretch">
                    <div class="glass-panel p-8 md:p-10 rounded-3xl text-left flex flex-col h-full w-full">
                        <h3 class="text-2xl md:text-3xl font-black mb-6 text-white font-display">${t.sectionTitles.formTitle}</h3>
                        <p class="text-gray-400 mb-8">${t.sectionTitles.formSub}</p>
                        <form id="contact-form" action="https://formspree.io/f/xkopgoaj" method="POST" class="space-y-6 flex-grow flex flex-col justify-between">
                            <div class="space-y-6">
                                <div><label class="block text-sm font-bold text-electric-cyan mb-2 uppercase tracking-wider">${t.sectionTitles.formName}</label><input type="text" name="name" required class="w-full bg-[#050a0e]/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-electric-cyan transition-colors"></div>
                                <div><label class="block text-sm font-bold text-electric-cyan mb-2 uppercase tracking-wider">${t.sectionTitles.formEmail}</label><input type="email" name="email" required class="w-full bg-[#050a0e]/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-electric-cyan transition-colors"></div>
                                <div><label class="block text-sm font-bold text-electric-cyan mb-2 uppercase tracking-wider">${t.sectionTitles.formPhone}</label><input type="tel" name="phone" required class="w-full bg-[#050a0e]/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-electric-cyan transition-colors"></div>
                                <div><label class="block text-sm font-bold text-electric-cyan mb-2 uppercase tracking-wider">${t.sectionTitles.formMessage}</label><textarea name="message" rows="4" required class="w-full bg-[#050a0e]/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-electric-cyan transition-colors resize-none"></textarea></div>
                            </div>
                            <div class="mt-6">
                                <button type="submit" class="w-full py-4 bg-electric-cyan text-[#050a0e] font-black uppercase tracking-widest rounded-xl hover:bg-white transition-all shadow-[0_0_20px_rgba(71,200,245,0.3)]">${t.sectionTitles.formSubmit}</button>
                                <p id="contact-form-status" class="mt-4 text-center"></p>
                            </div>
                        </form>
                    </div>
                    <div class="glass-panel p-8 md:p-10 rounded-3xl text-left flex flex-col h-full w-full">
                         <h3 class="text-2xl md:text-3xl font-black mb-6 text-white font-display">${t.sectionTitles.bookTitle}</h3>
                         <p class="text-gray-400 mb-8">${t.sectionTitles.bookSub}</p>
                         <div class="w-full overflow-hidden rounded-xl bg-white flex-grow flex flex-col" style="min-height: 500px;">
                            <div class="embedded-booking flex-grow" data-url="https://advonmedia.trafft.com" data-query="&t=s&uuid=1003c403-d56e-439b-876a-c563b3127470" data-employee="aggelos-metrides" data-lang="${currentLang}" data-autoresize="1" data-showsidebar="0" data-showservices="0" style="width: 100%; height: 100%;"></div>
                         </div>
                    </div>
                </div>
                <div class="grid md:grid-cols-2 gap-8">
                    <a href="mailto:angelos@advonmedia.com" class="group glass-panel p-8 rounded-3xl transition-all duration-300 hover:bg-electric-cyan/5">
                        <div class="w-16 h-16 bg-electric-cyan/10 rounded-2xl flex items-center justify-center mx-auto mb-6 text-electric-cyan group-hover:bg-electric-cyan group-hover:text-[#050a0e] transition-all"><i data-lucide="mail" class="w-8 h-8"></i></div>
                        <h3 class="text-xl font-black mb-2 text-white">Email</h3><p class="text-electric-cyan font-bold tracking-wide">angelos@advonmedia.com</p>
                    </a>
                    <a href="https://www.instagram.com/advon_media" target="_blank" class="group glass-panel p-8 rounded-3xl transition-all duration-300 hover:bg-electric-cyan/5">
                        <div class="w-16 h-16 bg-electric-cyan/10 rounded-2xl flex items-center justify-center mx-auto mb-6 text-electric-cyan group-hover:bg-electric-cyan group-hover:text-[#050a0e] transition-all"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg></div>
                        <h3 class="text-xl font-black mb-2 text-white">Instagram</h3><p class="text-electric-cyan font-bold tracking-wide">@advon_media</p>
                    </a>
                </div>
            `;

            // Footer
            document.getElementById('footer-content').innerHTML = `
                <div class="flex flex-col md:flex-row items-center gap-4">
                    <img src="https://assets.cdn.filesafe.space/NkFUgZER3rrdnofCwAIl/media/648dd017a1f733fa5b51e5e9.png" alt="Advon Media" class="h-8 w-auto opacity-50">
                    <p class="text-sm font-semibold">© 2026 Advon Media. ${t.footer.rights}</p>
                </div>
                <div class="flex gap-4 md:gap-6 text-sm font-bold uppercase flex-wrap justify-center text-electric-cyan/80">
                    <a href="#/privacy-policy" class="hover:text-electric-cyan transition-colors">${t.footer.p1}</a>
                    <span class="text-white/20">|</span>
                    <a href="#/cookies-policy" class="hover:text-electric-cyan transition-colors">${t.footer.p2}</a>
                    <span class="text-white/20">|</span>
                    <a href="#/terms-of-use" class="hover:text-electric-cyan transition-colors">${t.footer.p3}</a>
                </div>
            `;

            lucide.createIcons();

            // Reattach Formspree Integration for the newly rendered form
            const newForm = document.getElementById('contact-form');
            if(newForm) {
                newForm.addEventListener('submit', function(event) {
                    event.preventDefault();
                    var form = event.target;
                    var status = document.getElementById("contact-form-status");
                    var submitBtn = form.querySelector('button[type="submit"]');
                    var originalText = submitBtn.innerHTML;
                    
                    submitBtn.disabled = true; 
                    submitBtn.innerHTML = currentLang === 'el' ? 'Αποστολή...' : 'Sending...';

                    fetch(form.action, {
                        method: form.method,
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    }).then(response => {
                        submitBtn.disabled = false; submitBtn.innerHTML = originalText;
                        if (response.ok) {
                            status.innerHTML = currentLang === 'el' ? "Ευχαριστούμε! Το μήνυμά σας εστάλη επιτυχώς." : "Thank you! Your message was sent successfully.";
                            status.className = "mt-4 text-green-400 font-bold";
                            form.reset();
                        } else {
                            status.innerHTML = currentLang === 'el' ? "Ωχ! Υπήρξε ένα πρόβλημα." : "Oops! There was a problem.";
                            status.className = "mt-4 text-red-400 font-bold";
                        }
                    }).catch(error => {
                        submitBtn.disabled = false; submitBtn.innerHTML = originalText;
                        status.innerHTML = currentLang === 'el' ? "Ωχ! Υπήρξε ένα πρόβλημα." : "Oops! There was a problem.";
                        status.className = "mt-4 text-red-400 font-bold";
                    });
                });
            }
        }

        // --------------------------------------------------------
        // 3. INITIALIZATION
        // --------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            handleRoute();

            if (!document.getElementById('trafft-script')) {
                const script = document.createElement('script');
                script.id = 'trafft-script';
                script.src = 'https://advonmedia.trafft.com/embed.js';
                script.async = true;
                document.body.appendChild(script);
            }
        });

    </script>
</body>
</html>
