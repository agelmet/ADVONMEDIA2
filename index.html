        function closeMobileMenu() { document.getElementById('mobile-menu').style.maxHeight = '0px'; }

        function handleRoute() {
            const hash = window.location.hash || '#/';
            const views = document.querySelectorAll('.page-section');
            views.forEach(v => v.classList.remove('active'));

            let viewId = 'page-home';
            if (hash.startsWith('#/kataskevi-istoselidas')) viewId = 'page-website';
            else if (hash.startsWith('#/google-reviews-nfc')) viewId = 'page-nfc';
            else if (hash.startsWith('#/diaxeirisi-social-media')) viewId = 'page-social';
            else if (hash.startsWith('#/faq')) viewId = 'page-faq';
            else if (hash.startsWith('#/blog')) viewId = 'page-blog';
            else if (hash.startsWith('#/privacy-policy')) viewId = 'page-privacy';
            else if (hash.startsWith('#/cookies-policy')) viewId = 'page-cookies';
            else if (hash.startsWith('#/terms-of-use')) viewId = 'page-terms';
            
            document.getElementById(viewId).classList.add('active');
            
            if(viewId === 'page-website') updatePortfolioPagination();
            
            if (!hash.includes('#portfolio') && !hash.includes('#reviews') && !hash.includes('#contact')) {
                window.scrollTo({top: 0, behavior: 'auto'});
            }
            closeMobileMenu();

            setTimeout(() => {
                if (hash.includes('#portfolio') && document.getElementById('portfolio')) {
                    document.getElementById('portfolio').scrollIntoView({behavior: 'smooth', block: 'start'});
                } else if (hash.includes('#reviews') && document.getElementById('reviews')) {
                    document.getElementById('reviews').scrollIntoView({behavior: 'smooth', block: 'start'});
                } else if (hash.includes('#contact')) {
                    document.getElementById('contact').scrollIntoView({behavior: 'smooth', block: 'start'});
                }
            }, 100);
        }

        function toggleFaq(button) {
            const content = button.nextElementSibling;
            const icon = button.querySelector('i');
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {

            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                icon.style.transform = 'rotate(180deg)';
                button.classList.add('text-electric-cyan');
            }
        }

        // Initialize Background Canvas
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [];

        function initStars() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            stars = [];
            for (let i = 0; Math.floor(width * height / 1500) > i; i++) {
                stars.push({
                    x: Math.random() * width, y: Math.random() * height,
                    size: Math.random() * 2 + 0.5, opacity: Math.random(),
                    speed: Math.random() * 0.05 + 0.01, twinkleSpeed: Math.random() * 0.02 + 0.005, twinkleDir: 1
                });
            }
        }
        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.opacity += star.twinkleSpeed * star.twinkleDir;
                if (star.opacity > 1 || 0.2 > star.opacity) star.twinkleDir *= -1;
                star.y -= star.speed;
                if (0 > star.y) star.y = height;
                ctx.fillStyle = `rgba(71, 200, 245, ${Math.abs(star.opacity) * 0.8})`; 
                ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animateStars);
        }
        window.addEventListener('resize', initStars);

        // Load Ext Scripts & initialize
        document.addEventListener('DOMContentLoaded', () => {
            initStars(); 
            animateStars();
            renderApp();
            handleRoute();

            if (!document.getElementById('trafft-script')) {
                const script = document.createElement('script');
                script.id = 'trafft-script';
                script.src = 'https://advonmedia.trafft.com/embed.js';
                script.async = true;
                document.body.appendChild(script);
            }
        });

    </script>
</body>
</html>
